[project]
name = "rectangles-game"
version = "0.1.0"
description = "Pen-and-paper 'Rectangles' dice game, played on a shared grid with a Pygame GUI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "pygame-ce>=2.5.7",
    "uvicorn[standard]>=0.52.4",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]
