name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --deny-warnings
      # The integration tests need a full server; they run in the scala job against the Scala launcher.
      - run: npm test -- --exclude '**/*.integration.test.ts'
      - run: npm run build

  scala:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server-scala
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # `clean` between the lint checks and the tests: sbt 2 links compile outputs to a read-only cache that a second compile cannot overwrite.
      - run: sbt -batch "scalafmtCheckAll; scalafixAll --check; clean; testFull; server/stage"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend test against the staged Scala server
        working-directory: frontend
        env:
          RECTANGLES_SERVER_CMD: ${{ github.workspace }}/server-scala/target/stage/bin/rectangles-server
        run: |
          npm ci
          npx vitest run src/hooks/useGameSocket.integration.test.ts src/hooks/wireContract.integration.test.ts

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: docker build -t rectangles-server .
      - name: Run the container and connect
        run: |
          docker run -d --name rectangles --health-interval=2s --health-start-period=1s -p 8765:8765 rectangles-server
          for i in $(seq 1 30); do curl -fs localhost:8765/health && break; sleep 1; done
          curl -fs localhost:8765/health | grep -x ok
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' rectangles)" = healthy ] && break; sleep 1; done
          docker inspect -f '{{.State.Health.Status}}' rectangles | grep -x healthy
          curl -fs localhost:8765/ | grep -q 'id="root"'
          curl -fsI localhost:8765/ | grep -qi '^x-frame-options: DENY'
          node -e "
            const s = new WebSocket('ws://127.0.0.1:8765/ws?protocolVersion=1')
            s.onmessage = (e) => { console.log(String(e.data)); process.exit(String(e.data).includes('\"type\":\"state\"') ? 0 : 1) }
            s.onerror = () => process.exit(1)
            setTimeout(() => process.exit(1), 10000)"
      - if: failure()
        run: docker logs rectangles
